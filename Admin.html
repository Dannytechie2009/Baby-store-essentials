<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin — Kids & Momma Essentials</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/images/logo.png" alt="logo" class="logo-img">
      <div class="brand-text"><strong>Admin</strong></div>
    </div>
  </header>

  <main class="container">
    <h1>Product Manager</h1>

    <form id="product-form" class="card fade-in">
      <input id="product-id" type="hidden" />
      <label>
        Name
        <input id="product-name" required />
      </label>
      <label>
        Description
        <textarea id="product-desc"></textarea>
      </label>
      <label>
        Price (₦)
        <input id="product-price" type="number" min="0" step="0.01" required />
      </label>
      <label>
        Image (file or URL)
        <input id="product-image-file" type="file" accept="image/*" />
        <input id="product-image-url" placeholder="Or paste an image URL" />
      </label>

      <div class="preview">
        <img id="img-preview" src="assets/images/placeholder.png" alt="Preview" />
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Save Product</button>
        <button id="clear" type="button" class="btn btn-ghost">Clear</button>
      </div>
    </form>

    <section id="products-list" class="products-list fade-in"></section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="assets/js/script.js"></script>
  <script type="module" src="assets/js/config.js"></script>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
