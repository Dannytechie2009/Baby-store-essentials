<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shop — Kids & Momma Essentials</title>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/images/logo.png" alt="Kids & Momma Essentials" class="logo-img">
      <div class="brand-text"><strong>Kids & Momma Essentials</strong><small>Shop</small></div>
    </div>
  </header>

  <main class="container">
    <h1>Shop</h1>

    <div class="controls">
      <input id="search" placeholder="Search products..." />
      <select id="sort">
        <option value="new">Newest</option>
        <option value="low">Price: Low → High</option>
        <option value="high">Price: High → Low</option>
      </select>
    </div>

    <section id="products-grid" class="products-grid fade-in"></section>
  </main>

  <nav class="floating-nav" aria-label="Floating navigation">
    <a href="index.html" title="Home" class="nav-link"><i class="bx bx-home"></i></a>
    <a href="shop.html" title="Shop" class="nav-link active"><i class="bx bx-store"></i></a>
    <a href="about.html" title="About" class="nav-link"><i class="bx bx-info-circle"></i></a>
    <a href="contact.html" title="Contact" class="nav-link"><i class="bx bx-envelope"></i></a>
    <a href="cart.html" title="Cart" class="nav-link"><i class="bx bx-shopping-bag"></i><span id="cart-count">0</span></a>
  </nav>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="assets/js/script.js"></script>
  <script type="module" src="assets/js/shop.js"></script>
</body>
</html>
