<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Kids & Momma Essentials</title>
  <meta name="description" content="Contact Kids & Momma Essentials for questions, wholesale inquiries or custom requests." />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins','ui-sans-serif','system-ui'] }, colors: { mint: '#7FD8C6', peach: '#FFD1C1', cream: '#FFF6EA' }}}}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-cream min-h-screen text-gray-800">
  <header class="bg-white/75">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo.png" alt="logo" class="h-12" onerror="this.src='assets/placeholder.png'"/>
        <div class="text-lg font-semibold">Kids & Momma Essentials</div>
      </a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-mint">Contact Us</h1>
    <p class="mt-2 text-gray-600">Questions, wholesale inquiries, or custom requests — send us a message.</p>

    <!-- Web3Forms: we'll POST to their API with fetch so we can show UX feedback -->
    <form id="contact-form" class="mt-6 space-y-4 bg-white p-6 rounded shadow" aria-label="Contact form">
      <!-- Web3Forms requires at least API key and subject fields in the payload.
           Replace the apiKey value below with your Web3Forms API key. -->
      <input type="hidden" name="access_key" id="web3forms-key" value="YOUR_WEB3FORMS_API_KEY" />
      <div>
        <label class="block text-sm text-gray-700">Name</label>
        <input name="name" id="cf-name" class="mt-1 w-full px-3 py-2 border rounded" required/>
      </div>
      <div>
        <label class="block text-sm text-gray-700">Email</label>
        <input name="email" id="cf-email" type="email" class="mt-1 w-full px-3 py-2 border rounded" required/>
      </div>
      <div>
        <label class="block text-sm text-gray-700">Message</label>
        <textarea name="message" id="cf-message" rows="6" class="mt-1 w-full px-3 py-2 border rounded" required></textarea>
      </div>

      <div class="flex gap-3">
        <button id="contact-submit" type="submit" class="btn-primary">Send message</button>
        <button id="contact-clear" type="button" class="btn-ghost">Clear</button>
      </div>
      <div id="contact-note" class="text-sm text-gray-500 mt-2">We’ll respond within 1–2 business days.</div>
    </form>
  </main>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

  <!-- shared helpers & toasts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/toast.js"></script>

  <!-- contact form handler -->
  <script src="assets/js/contact.js"></script>
</body>
</html>
